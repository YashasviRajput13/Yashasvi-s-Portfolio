name: Deploy Vite Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble production bundle
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r public/. dist/
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(
              "</head>",
              "    <link rel=\"stylesheet\" href=\"/assets/folio-style.css\" />\n  </head>"
            );
            html = html.replace(
              /<script\b[^>]*src="\/src\/main\.tsx"[^>]*><\/script>/,
              "<script type=\"module\" src=\"/assets/folio-bundle.js\" data-folio-bundle=\"true\"></script>"
            );
            fs.writeFileSync("dist/index.html", html, "utf8");
          '
          echo "yashasvii.xyz" > dist/CNAME
          touch dist/.nojekyll
          ls -la dist dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
